[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptkit"
version = "0.1.0"
description = "极简的大模型提示词 / 工作流 DSL：把逻辑写成步骤树，让 Agent 自己调工具"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["llm", "workflow", "dsl", "agent", "prompt", "deepseek", "tool-calling", "markdown", "latex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "openai>=1.40",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# 终端 Markdown 排版、代码高亮、表格。没装就退回纯文本，功能不缺。
rich = ["rich>=13"]

# 块级公式的多行数学排版（\frac \int \sum …）。
# ⚠️ sympy 的 parse_latex 还需要 antlr4-python3-runtime，而且**版本挑**：
#    sympy 1.14 要求 == 4.11，新版本会被拒绝。所以这里不写死，
#    装了 sympy 之后按它报错里的版本号补装即可。没装也能用内置的 Unicode 映射。
math = ["sympy>=1.12"]

# 两个都装
render = ["rich>=13", "sympy>=1.12"]

# YamlFormatter 需要 pyyaml，其余地方零依赖
yaml = ["pyyaml>=6"]
dev = ["pytest>=8"]

# src 布局：包位于 src/promptkit/，用 packages.find 自动发现全部子包
#（含 core.steps.logics.expr_sys 这类深层子包）。
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
promptkit = [".env.example"]
