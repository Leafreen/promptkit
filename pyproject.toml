[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aipykit"
version = "0.1.0"
description = "极简的大模型提示词 / 工作流 DSL：把逻辑写成步骤树，让 Agent 自己调工具"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["llm", "workflow", "dsl", "agent", "prompt", "deepseek", "tool-calling", "markdown", "latex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "openai>=1.40",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# 终端 Markdown 排版、代码高亮、表格。没装就退回纯文本，功能不缺。
rich = ["rich>=13"]

# 终端渲染（rich）。
# 公式渲染内置零依赖的 Unicode 映射；TeXicode 零依赖，装上即自动增强。
# 图表：termaid 把 ```mermaid 画成字符画（纯 Python、零依赖）；
# DOT 走 phart / graph-easy 命令行（可选，不属于 Python 依赖）。
render = ["rich>=13", "termaid>=0.12", "TeXicode>=1.0"]

# 终端对话界面：EnableTUI() 用 rich + prompt_toolkit，fullscreen=True 用 Textual。
tui = [
    "rich>=13",
    "prompt_toolkit>=3.0",
    "textual>=1.0",
    "termaid>=0.12",
    "TeXicode>=1.0",
]

# YamlFormatter 需要 pyyaml，其余地方零依赖
yaml = ["pyyaml>=6"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8", "mypy>=1.10"]

# src 布局：包位于 src/aipykit/，用 packages.find 自动发现全部子包
#（含 core.steps.logics.expr_sys 这类深层子包）。
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aipykit = [".env.example"]

# 类型检查基线：先「检查带注解的函数」，不强制所有函数都写注解。
# 待 `docs/typing-any-audit.md` 的分批计划推进后再逐步收紧
# （check_untyped_defs → disallow_untyped_defs → disallow_any_explicit）。
[tool.mypy]
python_version = "3.10"
files = ["src/aipykit"]
check_untyped_defs = false
disallow_untyped_defs = false
disallow_any_explicit = false
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
pretty = false
